<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">


   <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
   <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


   <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">


   <title>SKU Generator</title>


   <style>
       body {
           margin: 0;
           background-color: #91c2cc;
           font-family: 'Montserrat', sans-serif;
           color: #252525;
       }


       .shop {
           width: 85%;
           max-width: 1050px;
           margin: 80px auto;
           background-color: #f8eee8;
           padding: 25px 35px 35px;
           box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
       }


       .brand {
           text-align: center;
           margin-bottom: 10px;
       }


       .brand h1 {
           font-family: 'DM Serif Display', serif;
           font-size: 38px;
           margin: 0;
           letter-spacing: -1px;
       }


       .brand p {
           font-size: 9px;
           letter-spacing: 3px;
           margin-top: 5px;
           text-transform: uppercase;
       }


       .navbar-custom {
           border-top: 1px solid #d8c9c2;
           border-bottom: 1px solid #d8c9c2;
           margin-bottom: 35px;
           padding: 7px 0;
       }


       .navbar-custom .navbar-nav {
           margin: auto;
       }


       .navbar-custom .nav-link {
           color: #333;
           font-size: 11px;
           letter-spacing: 1px;
           text-transform: uppercase;
           padding: 5px 20px;
       }


       .navbar-custom .nav-link:hover {
           color: #777;
       }


       .sku-section {
           max-width: 650px;
           margin: auto;
       }


       .section-title {
           text-align: center;
           font-family: 'DM Serif Display', serif;
           font-size: 30px;
           margin-bottom: 8px;
       }


       .section-description {
           text-align: center;
           font-size: 10px;
           color: #777;
           margin-bottom: 30px;
       }


       .form-group {
           margin-bottom: 20px;
       }


       .form-label {
           display: block;
           font-family: 'DM Serif Display', serif;
           font-size: 15px;
           margin-bottom: 7px;
       }


       #category {
           width: 100%;
           border: 1px solid #d8c9c2;
           background-color: #fffaf6;
           padding: 12px;
           font-family: 'Montserrat', sans-serif;
           font-size: 11px;
           border-radius: 0;
       }


       #product,
       #stock {
           width: 100%;
           border: 1px solid #d8c9c2;
           background-color: #fffaf6;
           padding: 12px;
           font-family: 'Montserrat', sans-serif;
           font-size: 11px;
           border-radius: 0;
           box-shadow: none;
       }


       #product:focus,
       #stock:focus,
       #category:focus {
           border-color: #777;
           outline: none;
           box-shadow: none;
       }


       #product::placeholder,
       #stock::placeholder {
           color: #aaa;
       }


       .generate-button {
           display: block;
           margin: 30px auto 0;
           background-color: #e7a5b9;
           color: #252525;
           border: none;
           border-radius: 20px;
           padding: 10px 35px;
           font-family: 'Montserrat', sans-serif;
           font-size: 10px;
           letter-spacing: 1px;
           text-transform: uppercase;
           transition: 0.2s;
       }


       .generate-button:hover {
           background-color: #d98ca6;
           transform: translateY(-1px);
       }


       .output-box {
           max-width: 650px;
           margin: 35px auto 0;
           padding: 30px;
           background-color: #fff8f3;
           border: 1px solid #dfd0c8;
           text-align: center;
           font-size: 11px;
       }


       .output-title {
           font-family: 'DM Serif Display', serif;
           font-size: 20px;
           margin-bottom: 10px;
       }


       footer {
           margin-top: 45px;
           padding-top: 20px;
           border-top: 1px solid #d8c9c2;
           text-align: center;
       }


       .footer-brand {
           font-family: 'DM Serif Display', serif;
           font-size: 25px;
       }


       .footer-text {
           font-size: 9px;
           color: #777;
           margin-top: 5px;
       }


       @media (max-width: 700px) {
           .shop {
               width: 94%;
               margin: 30px auto;
               padding: 20px;
           }


           .sku-section,
           .output-box {
               width: 100%;
           }
       }
   </style>
</head>


<body>
   <div class="shop">
       <header class="brand">
           <h1>La-La Services</h1>
           <p>Find: Love • Joy • Hope</p>
       </header>


       <nav class="navbar-custom">
           <div class="navbar-nav">
               <a class="nav-link" href="index.html">Receipt Generator</a>
               <a class="nav-link" href="PY-SKU.html">SKU Generator</a>
           </div>
       </nav>


       <section class="sku-section">
           <h2 class="section-title">SKU Generator</h2>
           <p class="section-description">
               Create a unique stock keeping unit for your product.
           </p>


           <form>
               <div class="form-group">
                   <label for="category" class="form-label">Category</label>


                   <select id="category" class="form-control">
                       <option value="PER">Perishables</option>
                       <option value="NON">Non-Perishables</option>
                       <option value="ELE">Electronics</option>
                       <option value="CLO">Clothing</option>
                   </select>
               </div>


               <div class="form-group">
                   <label for="product" class="form-label">Product Name</label>
                   <input type="text" id="product" class="form-control" placeholder="e.g. Bottled Water">
               </div>


               <div class="form-group">
                   <label for="stock" class="form-label">Stock Quantity</label>
                   <input type="number" id="stock" class="form-control" placeholder="e.g. 50">
               </div>


               <button type="button" py-click="generate_sku" class="generate-button">
                   Generate SKU
               </button>
           </form>
       </section>


       <div id="output2" class="output-box">
           <div class="output-title">Generated SKU</div>
           <div>Your generated SKU will appear here.</div>
       </div>


       <footer>
           <div class="footer-brand">La-La Inc.</div>
           <div class="footer-text">Lacuesta-Ladion Inc. services</div>
           <div class="footer-text">Made for Fairview ICT Project • 2026</div>
       </footer>
   </div>


   <script type="py" src="main.py"></script>

</body>
</html>
