<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
       .container {
            padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            background-color: rgba(0, 0, 0, 0.1);
       } 
    </style>

    <title>SKU</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-black bg-light">

        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Reciept Generator
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="PY-SKU.html">
                        SKU Generator
                    </a>
                </li>

            </ul>
        </div>

    </nav>


    <div class="container mt-5">

        <h1 class="text-center">SKU Generator</h1>

        <br>

        <form>

            <label for="category">Category</label>

            <select id="category" class="form-control">

                <option value="PER">Perishables</option>
                <option value="NON">Non-Perishables</option>
                <option value="ELE">Electronics</option>
                <option value="CLO">Clothing</option>

            </select>

            <br>


            <label for="product">Product Name</label>

            <input type="text" id="product" class="form-control" placeholder="e.g. Bottled Water">

            <br>


            <label for="stock">Stock Quantity</label>

            <input type="number" id="stock" class="form-control" placeholder="e.g. 50">

            <br>


            <button type="button" py-click="generate_sku" class="btn btn-secondary"> Generate SKU </button>

        </form>

    </div>


    <br>
    <br>


    <div id="output2" class="text-center container">

        Your generated SKU will appear here.

    </div>


    <script type="py" src="main.py"></script>

</body>
</html>
