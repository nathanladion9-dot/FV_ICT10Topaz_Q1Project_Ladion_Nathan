<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Receipt Generator</title>


   <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
   <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


   <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">


   <style>
       body {
           margin: 0;
           background-color: #91c2cc;
           font-family: 'Montserrat', sans-serif;
           color: #252525;
       }


       .shop {
           width: 85%;
           max-width: 1050px;
           margin: 80px auto;
           background-color: #f8eee8;
           padding: 25px 35px 35px;
           box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
       }


       .brand {
           text-align: center;
           margin-bottom: 10px;
       }


       .brand h1 {
           font-family: 'DM Serif Display', serif;
           font-size: 38px;
           margin: 0;
           letter-spacing: -1px;
       }


       .brand p {
           font-size: 9px;
           letter-spacing: 3px;
           margin-top: 5px;
           text-transform: uppercase;
       }


       .navbar-custom {
           border-top: 1px solid #d8c9c2;
           border-bottom: 1px solid #d8c9c2;
           margin-bottom: 25px;
           padding: 7px 0;
       }


       .navbar-custom .navbar-nav {
           margin: auto;
       }


       .navbar-custom .nav-link {
           color: #333;
           font-size: 11px;
           letter-spacing: 1px;
           text-transform: uppercase;
           padding: 5px 20px;
       }


       .navbar-custom .nav-link:hover {
           color: #777;
       }


       .product {
           text-align: left;
       }


       .product-image {
           height: 230px;
           display: flex;
           justify-content: center;
           align-items: center;
           position: relative;
           overflow: hidden;
       }


       .yellow {
           background-color: #f9d83d;
       }


       .blue {
           background-color: #91bdc7;
       }


       .green {
           background-color: #718d60;
       }


       .pink {
           background-color: #ef4e7d;
       }


       .orange {
           background-color: #f26636;
       }


       .product-placeholder {
           width: 75%;
           height: 80%;
           object-fit: contain;
           display: block;
           filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.18));
       }


       .product-info {
           padding-top: 8px;
       }


       .product-name {
           font-family: 'DM Serif Display', serif;
           font-size: 14px;
           margin: 0;
       }


       .product-price {
           font-size: 11px;
           margin-top: 2px;
           color: #555;
       }


       .product-select {
           margin-top: 6px;
       }


       .product-select input {
           accent-color: #333;
       }


       .product-select label {
           font-size: 10px;
           margin-left: 3px;
           cursor: pointer;
       }


       .size-section {
           margin-top: 35px;
           text-align: center;
           border-top: 1px solid #d8c9c2;
           padding-top: 20px;
       }


       .size-title {
           font-family: 'DM Serif Display', serif;
           font-size: 18px;
           margin-bottom: 12px;
       }


       .size-option {
           font-size: 11px;
           margin: 0 10px;
       }


       .size-option input {
           accent-color: #333;
           margin-right: 4px;
       }


       .order-button {
           margin-top: 20px;
           background-color: #e7a5b9;
           border: none;
           padding: 9px 35px;
           border-radius: 20px;
           font-family: 'Montserrat', sans-serif;
           font-size: 10px;
           letter-spacing: 1px;
           text-transform: uppercase;
           transition: 0.2s;
       }


       .order-button:hover {
           background-color: #d98ca6;
           transform: translateY(-1px);
       }


       #order {
           margin: 25px auto 0;
           padding: 20px;
           background-color: #fff8f3;
           border: 1px solid #dfd0c8;
           font-size: 12px;
           text-align: center;
       }


       footer {
           margin-top: 40px;
           padding-top: 20px;
           border-top: 1px solid #d8c9c2;
           text-align: center;
       }


       .footer-brand {
           font-family: 'DM Serif Display', serif;
           font-size: 25px;
       }


       .footer-text {
           font-size: 9px;
           color: #777;
           margin-top: 5px;
       }
   </style>
</head>


<body>
   <div class="shop">
       <header class="brand">
           <h1>La-La café</h1>
           <p>Find: Love • Joy • Hope</p>
       </header>


       <nav class="navbar-custom">
           <div class="navbar-nav">
               <a class="nav-link" href="index.html">Receipt Generator</a>
               <a class="nav-link" href="PY-SKU.html">SKU Generator</a>
           </div>
       </nav>


       <form>
           <div class="row g-3">


               <div class="col-12 col-sm-6 col-md-4">
                   <div class="product">
                       <div class="product-image yellow">
                           <img class="product-placeholder"
                                src="https://i.pinimg.com/736x/b2/a9/f6/b2a9f654bb07b9e833a135770db56635.jpg"
                                alt="Spanish Latte">
                       </div>


                       <div class="product-info">
                           <p class="product-name">Spanish Latte</p>
                           <p class="product-price">₱150.00</p>


                           <div class="product-select">
                               <input type="checkbox" id="item1" value="150">
                               <label for="item1">Add to order</label>
                           </div>
                       </div>
                   </div>
               </div>


               <div class="col-12 col-sm-6 col-md-4">
                   <div class="product">
                       <div class="product-image blue">
                           <img class="product-placeholder"
                                src="https://i.pinimg.com/736x/b9/25/71/b92571b2fbfe8fda86e58cf5cfc50e1d.jpg"
                                alt="Black Coffee">
                       </div>


                       <div class="product-info">
                           <p class="product-name">Black Coffee</p>
                           <p class="product-price">₱80.00</p>


                           <div class="product-select">
                               <input type="checkbox" id="item2" value="80">
                               <label for="item2">Add to order</label>
                           </div>
                       </div>
                   </div>
               </div>


               <div class="col-12 col-sm-6 col-md-4">
                   <div class="product">
                       <div class="product-image green">
                           <img class="product-placeholder"
                                src="https://i.pinimg.com/736x/d1/97/3e/d1973eff377fb3477c8be70b5151f87b.jpg"
                                alt="Espresso">
                       </div>


                       <div class="product-info">
                           <p class="product-name">Espresso</p>
                           <p class="product-price">₱100.00</p>


                           <div class="product-select">
                               <input type="checkbox" id="item3" value="100">
                               <label for="item3">Add to order</label>
                           </div>
                       </div>
                   </div>
               </div>


               <div class="col-12 col-sm-6 col-md-4">
                   <div class="product">
                       <div class="product-image pink">
                           <img class="product-placeholder"
                                src="https://i.pinimg.com/1200x/c0/46/2a/c0462aba87c717ea044e5dccacf0f80d.jpg"
                                alt="Cappuccino">
                       </div>


                       <div class="product-info">
                           <p class="product-name">Cappuccino</p>
                           <p class="product-price">₱120.00</p>


                           <div class="product-select">
                               <input type="checkbox" id="item4" value="120">
                               <label for="item4">Add to order</label>
                           </div>
                       </div>
                   </div>
               </div>


               <div class="col-12 col-sm-6 col-md-4">
                   <div class="product">
                       <div class="product-image orange">
                           <img class="product-placeholder"
                                src="https://i.pinimg.com/736x/d6/71/8c/d6718c2006d95c1f1deef343fdd766ec.jpg"
                                alt="Matcha">
                       </div>


                       <div class="product-info">
                           <p class="product-name">Matcha</p>
                           <p class="product-price">₱200.00</p>


                           <div class="product-select">
                               <input type="checkbox" id="item5" value="200">
                               <label for="item5">Add to order</label>
                           </div>
                       </div>
                   </div>
               </div>


           </div>


           <div class="size-section">
               <div class="size-title">Choose your size</div>


               <label class="size-option">
                   <input type="radio" id="regular" value="0" name="size" checked>
                   Regular (+₱0)
               </label>


               <label class="size-option">
                   <input type="radio" id="large" value="30" name="size">
                   Large (+₱30)
               </label>


               <br>


               <button type="button" class="order-button" py-click="create_order">
                   Create Order
               </button>
           </div>
       </form>


       <div id="order">Total / Receipt</div>


       <footer>
           <div class="footer-brand">La-La Inc.</div>
           <div class="footer-text">Lacuesta-Ladion Inc. services</div>
           <div class="footer-text">Made for Fairview ICT Project • 2026</div>
       </footer>
   </div>


   <script type="py" src="main.py"></script>
</body>
</html>
